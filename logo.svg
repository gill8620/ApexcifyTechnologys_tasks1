<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1b3e;stop-opacity:1" />
    </linearGradient>
    <!-- Icon gradient -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b2ff7;stop-opacity:1" />
    </linearGradient>
    <!-- Text gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b2ff7;stop-opacity:1" />
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="520" height="160" rx="18" ry="18" fill="url(#bgGrad)" />

  <!-- Subtle border glow -->
  <rect width="518" height="158" x="1" y="1" rx="17" ry="17"
        fill="none" stroke="url(#iconGrad)" stroke-width="1.5" opacity="0.5"/>

  <!-- ===== Icon Mark: stylised "A" apex/peak shape ===== -->
  <!-- Outer hexagon ring -->
  <polygon points="80,28 104,42 104,70 80,84 56,70 56,42"
           fill="none" stroke="url(#iconGrad)" stroke-width="2.5"
           filter="url(#glow)" opacity="0.8"/>

  <!-- Inner filled hexagon -->
  <polygon points="80,38 98,48 98,68 80,78 62,68 62,48"
           fill="url(#iconGrad)" opacity="0.15"/>

  <!-- Bold "A" peak shape inside hex -->
  <polyline points="68,72 80,34 92,72" fill="none"
            stroke="url(#iconGrad)" stroke-width="3.5"
            stroke-linecap="round" stroke-linejoin="round"
            filter="url(#glow)"/>
  <line x1="72" y1="60" x2="88" y2="60"
        stroke="url(#iconGrad)" stroke-width="3" stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- Circuit-style dots at corners -->
  <circle cx="80" cy="28" r="3" fill="#00d4ff" opacity="0.9" filter="url(#glow)"/>
  <circle cx="104" cy="42" r="3" fill="#7b2ff7" opacity="0.9" filter="url(#glow)"/>
  <circle cx="104" cy="70" r="3" fill="#7b2ff7" opacity="0.9" filter="url(#glow)"/>
  <circle cx="80" cy="84" r="3" fill="#00d4ff" opacity="0.9" filter="url(#glow)"/>
  <circle cx="56" cy="70" r="3" fill="#00d4ff" opacity="0.9" filter="url(#glow)"/>
  <circle cx="56" cy="42" r="3" fill="#00d4ff" opacity="0.9" filter="url(#glow)"/>

  <!-- ===== Company name ===== -->
  <!-- "Apexcify" -->
  <text x="126" y="70"
        font-family="'Segoe UI', 'Arial Black', Arial, sans-serif"
        font-size="38" font-weight="900" letter-spacing="1"
        fill="url(#textGrad)" filter="url(#glow)">Apexcify</text>

  <!-- "Technologys" smaller, below -->
  <text x="128" y="100"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="16" font-weight="400" letter-spacing="5"
        fill="#a0b4cc" opacity="0.9">TECHNOLOGYS</text>

  <!-- Decorative separator line -->
  <line x1="126" y1="108" x2="460" y2="108"
        stroke="url(#iconGrad)" stroke-width="1" opacity="0.4"/>

  <!-- Tagline -->
  <text x="128" y="126"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="11" font-weight="300" letter-spacing="2"
        fill="#6a8aaa" opacity="0.8">Innovate · Accelerate · Elevate</text>
</svg>
